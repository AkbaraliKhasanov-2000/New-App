# XcodeGen spec — regenerate the Xcode project with:  xcodegen generate
name: Scanlet
options:
  bundleIdPrefix: com.scanlet
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  useBaseInternationalization: false
knownRegions: [en, ru, uz, Base]

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Scanlet:
    type: application
    platform: iOS
    sources:
      - path: Scanlet
        excludes:
          - "Resources/Products.storekit"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scanlet.app
        PRODUCT_NAME: Scanlet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scanlet
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSCameraUsageDescription: "Scanlet uses the camera to scan your documents."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Scanlet uses Face ID to keep your documents private."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES

  ScanletTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ScanletTests]
    dependencies:
      - target: Scanlet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scanlet.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Scanlet.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Scanlet"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Scanlet:
    build:
      targets:
        Scanlet: all
        ScanletTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Scanlet/Resources/Products.storekit
    test:
      config: Debug
      targets: [ScanletTests]
    archive:
      config: Release
