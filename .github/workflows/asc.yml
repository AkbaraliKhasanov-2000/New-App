name: App Store Connect

# Run manually from the Actions tab. Needs repository secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to do"
        type: choice
        default: status
        options:
          - status           # read-only: bundle ID, app record, subscriptions
          - bundle           # register com.scanlet.app
          - subscriptions    # Scanmuse Pro group, weekly + monthly, prices, 3-day trial
          - metadata-check   # validate limits + download current App Store metadata
          - metadata-upload  # upload name/subtitle/keywords/description/promo for every locale

jobs:
  asc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Add repository secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (contents of the .p8 file)."
            exit 1
          fi
      - name: API tasks
        if: ${{ inputs.task == 'status' || inputs.task == 'bundle' || inputs.task == 'subscriptions' }}
        run: |
          pip install --quiet pyjwt cryptography requests
          python3 tools/asc/asc_setup.py ${{ inputs.task }}
      - name: Validate metadata limits
        if: ${{ startsWith(inputs.task, 'metadata') }}
        run: python3 tools/aso/metadata.py --check
      - uses: ruby/setup-ruby@v1
        if: ${{ startsWith(inputs.task, 'metadata') }}
        with:
          ruby-version: "3.3"
      - name: fastlane deliver
        if: ${{ startsWith(inputs.task, 'metadata') }}
        run: |
          gem install fastlane --no-document
          python3 -c "import json,os; json.dump({'key_id': os.environ['ASC_KEY_ID'], 'issuer_id': os.environ['ASC_ISSUER_ID'], 'key': os.environ['ASC_KEY_P8'], 'in_house': False}, open('asc_api_key.json','w'))"
          if [ "${{ inputs.task }}" = "metadata-upload" ]; then
            fastlane deliver --api_key_path asc_api_key.json
          else
            fastlane deliver download_metadata --api_key_path asc_api_key.json --app_identifier com.scanlet.app --metadata_path /tmp/current --force
          fi
          rm -f asc_api_key.json
