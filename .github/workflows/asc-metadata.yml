name: App Store metadata upload

# Manually run from the Actions tab. Uploads name, subtitle, keywords, description, promotional text,
# URLs and review notes for every localization in fastlane/metadata to App Store Connect.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only validate (no upload)"
        type: boolean
        default: true

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate metadata limits
        run: python3 tools/aso/metadata.py --check
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install fastlane
        run: gem install fastlane --no-document
      - name: Write API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Add repository secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (contents of the .p8 file)."
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"],
                     "key": os.environ["ASC_KEY_P8"], "in_house": False}, open("asc_api_key.json", "w"))
          PY
      - name: Verify (download current metadata)
        if: ${{ inputs.dry_run }}
        run: fastlane deliver download_metadata --api_key_path asc_api_key.json --app_identifier com.scanlet.app --metadata_path /tmp/current --force
      - name: Upload metadata
        if: ${{ !inputs.dry_run }}
        run: fastlane deliver --api_key_path asc_api_key.json
      - name: Remove key
        if: always()
        run: rm -f asc_api_key.json
